<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Autorização PranchetaFC</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 0 auto; padding: 32px 16px; line-height: 1.6; background: #0b1430; color: #eef2ff; }
  textarea { width: 100%; box-sizing: border-box; min-height: 96px; font: 14px/1.4 ui-monospace, Consolas, monospace; padding: 10px; border-radius: 8px; border: 1px solid #3a4670; background: #121c3d; color: #eef2ff; }
  button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: #ffd84d; color: #111; font-weight: 700; cursor: pointer; }
  .err { color: #ff8a80; }
</style>
</head>
<body>
<h1>Autorização recebida</h1>
<p id="msg">Copie o texto abaixo e cole no terminal do PranchetaFC Publisher.</p>
<textarea id="out" readonly></textarea>
<button id="copy" type="button">Copiar</button>
<p style="opacity:.7;font-size:.9rem">Esta página só mostra o código que o TikTok devolveu na barra de endereço. Nada é enviado a nenhum servidor.</p>
<script>
  const q = new URLSearchParams(location.search);
  const out = document.getElementById('out');
  if (q.get('error')) {
    document.getElementById('msg').className = 'err';
    document.getElementById('msg').textContent = 'O TikTok devolveu um erro: ' + q.get('error') + ' ' + (q.get('error_description') || '');
  }
  out.value = location.href;
  document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(out.value); } catch { out.select(); document.execCommand('copy'); }
    document.getElementById('copy').textContent = 'Copiado!';
  };
</script>
</body>
</html>
